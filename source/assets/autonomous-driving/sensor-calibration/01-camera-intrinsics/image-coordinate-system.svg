<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">图像坐标系与像素坐标系</title>
  <desc id="desc">图片左上角为像素坐标原点，u轴向右、v轴向下，主点坐标为cx和cy，投影点像素坐标为u和v</desc>
  <defs>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#d87f9d"/></marker>
    <marker id="arrow-lilac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#9483af"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#967c89" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1200" height="680" rx="30" fill="#fcf8fb"/>
  <circle cx="1100" cy="610" r="190" fill="#e3f4ef" opacity=".9"/>
  <circle cx="110" cy="30" r="170" fill="#f7e3eb" opacity=".82"/>

  <g font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
    <text x="58" y="72" fill="#51434e" font-size="30" font-weight="700">图像坐标系：点最终落在哪个像素</text>
    <text x="59" y="108" fill="#8a7b86" font-size="18">原点在左上角 Ouv，(u, v) 的单位是像素</text>
  </g>

  <g transform="translate(245 145)" filter="url(#shadow)">
    <rect width="710" height="430" rx="18" fill="#ffffff" stroke="#ead9e1" stroke-width="3"/>
    <path d="M64 2v426M128 2v426M192 2v426M256 2v426M320 2v426M384 2v426M448 2v426M512 2v426M576 2v426M640 2v426M704 2v426M2 54h706M2 108h706M2 162h706M2 216h706M2 270h706M2 324h706M2 378h706" fill="none" stroke="#dce9e7" stroke-width="1.5" opacity=".7"/>
    <path d="M0 0H684" fill="none" stroke="#d87f9d" stroke-width="5" marker-end="url(#arrow-rose)"/>
    <path d="M0 0V404" fill="none" stroke="#9483af" stroke-width="5" marker-end="url(#arrow-lilac)"/>

    <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="24" font-weight="700">
      <text x="683" y="-15" fill="#c26e8a">u</text>
      <text x="-28" y="413" fill="#7f6c9b">v</text>
      <text x="13" y="31" fill="#51434e">Ouv (0, 0)</text>
    </g>

    <path d="M355 0V215M0 215H355" fill="none" stroke="#6cc3b2" stroke-width="3" stroke-dasharray="9 9"/>
    <circle cx="355" cy="215" r="11" fill="#62b9a9" stroke="#ffffff" stroke-width="5"/>
    <g font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
      <text x="372" y="204" fill="#438c80" font-size="19" font-weight="700">主点 c</text>
      <text x="372" y="231" fill="#6e7e7b" font-size="17">(cx, cy)</text>
    </g>

    <path d="M0 116H540M540 0V116" fill="none" stroke="#e38d77" stroke-width="3" stroke-dasharray="8 8"/>
    <circle cx="540" cy="116" r="12" fill="#e38d77" stroke="#ffffff" stroke-width="5"/>
    <g font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
      <text x="557" y="104" fill="#b96654" font-size="19" font-weight="700">像素点 p</text>
      <text x="557" y="131" fill="#7e706d" font-size="17">(u, v)</text>
    </g>

    <g font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16">
      <rect x="222" y="392" width="266" height="26" rx="13" fill="#f7e9ef"/>
      <text x="355" y="411" fill="#a56178" text-anchor="middle">图片宽度 W 像素</text>
      <rect x="566" y="391" width="125" height="27" rx="13.5" fill="#eee8f5"/>
      <text x="628" y="410" fill="#81718e" text-anchor="middle">高度 H 像素</text>
    </g>
  </g>

  <g transform="translate(365 604)" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
    <rect width="470" height="45" rx="22.5" fill="#ffffff" stroke="#eadde4" stroke-width="2"/>
    <circle cx="25" cy="22.5" r="6" fill="#d87f9d"/>
    <text x="44" y="29" fill="#725f6c" font-size="17">内参 K：把归一化坐标 (x, y) 换成像素坐标 (u, v)</text>
  </g>
</svg>
