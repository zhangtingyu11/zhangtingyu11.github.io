<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">相机内参文章封面</title>
  <desc id="desc">深蓝色科技网格背景上的相机内参矩阵与道路透视线</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#020b18"/><stop offset=".55" stop-color="#071b34"/><stop offset="1" stop-color="#0b2950"/>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" fill="none" stroke="#45cfe8" stroke-opacity=".1"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1250" cy="180" r="430" fill="url(#glow)" filter="url(#blur)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M175 900 760 405M1425 900 840 405" stroke="#38bdf8" stroke-width="5" stroke-opacity=".65"/>
    <path d="M595 900 785 405M1005 900 815 405" stroke="#a78bfa" stroke-width="3" stroke-opacity=".5" stroke-dasharray="24 25"/>
    <path d="M330 760h940M470 640h660M580 545h440M675 470h250" stroke="#38bdf8" stroke-opacity=".22" stroke-width="2"/>
  </g>
  <g transform="translate(190 125)">
    <text x="0" y="0" fill="#67e8f9" font-family="ui-monospace, monospace" font-size="28" letter-spacing="7">SENSOR CALIBRATION · 01</text>
    <text x="0" y="100" fill="#f8fbff" font-family="system-ui, sans-serif" font-size="76" font-weight="700">相机内参</text>
    <text x="4" y="160" fill="#aac4e4" font-family="system-ui, sans-serif" font-size="30">五个参数，如何改变一张图像</text>
  </g>
  <g transform="translate(960 255)" fill="#dffaff" font-family="ui-monospace, monospace" font-size="43" text-anchor="middle">
    <path d="M-235-105h-28v300h28M235-105h28v300h-28" fill="none" stroke="#67e8f9" stroke-width="4"/>
    <text x="-155" y="-30">fₓ</text><text x="0" y="-30">s</text><text x="155" y="-30">cₓ</text>
    <text x="-155" y="70">0</text><text x="0" y="70">fᵧ</text><text x="155" y="70">cᵧ</text>
    <text x="-155" y="170">0</text><text x="0" y="170">0</text><text x="155" y="170">1</text>
  </g>
</svg>
