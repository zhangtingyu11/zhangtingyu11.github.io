<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">相机内参文章封面</title>
  <desc id="desc">清新的薄荷绿背景中，一台相机将光线投向成像平面，右侧完整展示相机内参矩阵</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#4e7d73" flood-opacity=".13"/>
    </filter>
  </defs>

  <rect width="1600" height="800" rx="36" fill="#f7fbfa"/>
  <circle cx="1450" cy="55" r="250" fill="#deefff" opacity=".72"/>
  <circle cx="90" cy="760" r="290" fill="#ddf6ef" opacity=".9"/>
  <path d="M0 570C245 480 400 650 635 564S1015 407 1244 501s255 42 356 0v299H0Z" fill="#e5f5f0" opacity=".62"/>

  <g transform="translate(112 102)">
    <g font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" letter-spacing="3">
      <rect width="62" height="34" rx="17" fill="#173f45"/>
      <text x="31" y="23" fill="#ffffff" text-anchor="middle" letter-spacing="1">01</text>
      <text x="82" y="24" fill="#5b8b82">相机模型</text>
    </g>
    <text x="0" y="126" fill="#173f45" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="74" font-weight="700">相机内参</text>
    <text x="3" y="180" fill="#66827c" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="27">五个参数，如何改变一张图像</text>

    <g transform="translate(18 270)">
      <path d="M48 74 170 24l122 50v176L170 300 48 250Z" fill="#ffffff" stroke="#9bd8ca" stroke-width="4" filter="url(#shadow)"/>
      <circle cx="170" cy="162" r="77" fill="#86d4c4"/>
      <circle cx="170" cy="162" r="49" fill="#ffffff" opacity=".82"/>
      <circle cx="170" cy="162" r="25" fill="#477e79"/>
      <circle cx="153" cy="143" r="10" fill="#ffffff" opacity=".85"/>
      <path d="M77 62 105 14h72l27 31" fill="#ffffff" stroke="#9bd8ca" stroke-width="4" stroke-linejoin="round"/>
      <path d="M305 112 440 68v188l-135-44Z" fill="#f8fcfb" stroke="#81cdbd" stroke-width="4" stroke-linejoin="round"/>
      <path d="m293 120 147-52M293 204l147 52" fill="none" stroke="#ffae98" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 12" opacity=".9"/>
      <line x1="366" y1="91" x2="366" y2="232" stroke="#acdcd2" stroke-width="3"/>
      <line x1="326" y1="162" x2="414" y2="162" stroke="#acdcd2" stroke-width="3"/>
      <circle cx="366" cy="162" r="8" fill="#ff9f87"/>
    </g>
  </g>

  <g transform="translate(905 142)" filter="url(#shadow)">
    <rect width="565" height="510" rx="32" fill="#ffffff" stroke="#d3ebe5" stroke-width="3"/>
    <g transform="translate(46 38)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
      <text x="0" y="24" fill="#75a198" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" letter-spacing="3">内参矩阵</text>
      <line x1="0" y1="47" x2="473" y2="47" stroke="#e1efec" stroke-width="2"/>
      <text x="0" y="105" fill="#173f45" font-size="36" font-weight="700">K =</text>

      <g transform="translate(115 83)" fill="#244e54" font-size="35" text-anchor="middle">
        <path d="M12 0H0v292h12M330 0h12v292h-12" fill="none" stroke="#69c7b4" stroke-width="5" stroke-linecap="round"/>
        <text x="56" y="62">f</text><text x="73" y="70" font-size="19">x</text>
        <text x="171" y="62" fill="#e98e77">s</text>
        <text x="274" y="62">c</text><text x="291" y="70" font-size="19">x</text>
        <text x="62" y="146" fill="#91aaa5">0</text>
        <text x="165" y="146">f</text><text x="182" y="154" font-size="19">y</text>
        <text x="274" y="146">c</text><text x="291" y="154" font-size="19">y</text>
        <text x="62" y="230" fill="#91aaa5">0</text><text x="171" y="230" fill="#91aaa5">0</text><text x="280" y="230">1</text>
      </g>

      <g transform="translate(0 406)" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
        <rect width="473" height="46" rx="23" fill="#eef8f5"/>
        <circle cx="27" cy="23" r="6" fill="#69c7b4"/>
        <text x="47" y="30" fill="#557a73" font-size="18">焦距 · 主点 · 倾斜</text>
      </g>
    </g>
  </g>
</svg>
