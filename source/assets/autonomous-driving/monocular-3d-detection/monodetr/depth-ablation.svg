<svg xmlns="http://www.w3.org/2000/svg" width="900" height="790" viewBox="0 0 900 790" role="img" aria-labelledby="t d"><title id="t">表 8 改动的是标签构造与深度分箱</title><desc id="d">Fore 用二维框填物体深度再分箱。Dense 换为稠密监督，但标签生成细节未公开。UD 和 SID 只更换分箱规则。预测分布与类别标签计算损失。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#55747d"/></marker></defs><rect width="900" height="790" rx="16" fill="#f6f5f0"/><g font-family="Microsoft YaHei, sans-serif" fill="#203a43"><text x="32" y="44" font-size="25" font-weight="bold">表 8：到底改了哪一步？</text><text x="32" y="76" font-size="16" fill="#63767c">补充示意 · Fore 流程依据官方默认实现；Dense 仅展示原文明确信息</text><text x="32" y="118" font-size="19">① 默认：Fore. LID</text><rect x="32" y="138" width="228" height="108" rx="9" fill="#dfebed"/><text x="48" y="168" font-size="18">二维框 + 物体深度</text><text x="48" y="195" font-size="18">例：这辆车为 20 m</text><path d="M265 190L305 190" stroke="#55747d" stroke-width="2" marker-end="url(#arrow)"/><rect x="316" y="138" width="238" height="108" rx="9" fill="#dfebed"/><text x="332" y="168" font-size="18">框内都填 20 m</text><text x="332" y="195" font-size="18">重叠处：近物体覆盖远物体</text><path d="M560 190L600 190" stroke="#55747d" stroke-width="2" marker-end="url(#arrow)"/><rect x="612" y="138" width="255" height="108" rx="9" fill="#dfebed"/><text x="628" y="168" font-size="18">按 LID 分箱</text><text x="628" y="195" font-size="18">米数 → 每像素一个类别</text><text x="32" y="295" font-size="19">② Dense LID：换监督，保留 LID</text><rect x="32" y="315" width="522" height="93" rx="9" fill="#f1e4d2"/><text x="48" y="345" font-size="18">稠密深度监督</text><text x="48" y="372" font-size="18">标签来源、补全和无效像素处理：正文未交代</text><path d="M560 359L600 359" stroke="#55747d" stroke-width="2" marker-end="url(#arrow)"/><rect x="612" y="315" width="255" height="93" rx="9" fill="#dfebed"/><text x="628" y="345" font-size="18">仍按 LID 分箱</text><text x="628" y="372" font-size="18">不虚构具体标签生成流程</text><text x="32" y="457" font-size="19">③ Fore. UD / SID：仍填物体深度，只换分箱</text><rect x="32" y="477" width="330" height="95" rx="9" fill="#dfebed"/><text x="48" y="507" font-size="18">同一张框内填充深度图</text><text x="48" y="534" font-size="18">前景标签构造不变</text><path d="M368 525L410 525" stroke="#55747d" stroke-width="2" marker-end="url(#arrow)"/><rect x="422" y="477" width="445" height="95" rx="9" fill="#dfebed"/><text x="438" y="507" font-size="18">UD：距离区间等宽</text><text x="438" y="534" font-size="18">SID：按对数尺度安排距离区间</text><text x="32" y="622" font-size="19">监督怎样作用到网络？</text><rect x="32" y="642" width="330" height="90" rx="9" fill="#dfebed"/><text x="48" y="672" font-size="18">图像 → 深度预测器</text><text x="48" y="699" font-size="18">每个位置输出 81 类分数</text><path d="M367 686L410 686" stroke="#55747d" stroke-width="2" marker-end="url(#arrow)"/><rect x="422" y="642" width="445" height="90" rx="9" fill="#dfebed"/><text x="438" y="672" font-size="18">预测分数 + 上面生成的类别标签</text><text x="438" y="699" font-size="18">focal loss → 反向传播更新网络</text><text x="32" y="768" font-size="17">表中 AP 衡量最终三维检测精度，不是深度图误差。</text></g></svg>