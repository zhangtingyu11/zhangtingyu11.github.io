<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc"><title id="title">UD、LID、SID 深度分箱对比</title><desc id="desc">三种方法使用相同的零到六十米距离坐标，每行八个区间。UD等宽，LID区间宽度线性增加，SID在log(1+d)空间等宽。论文使用八十个前景分箱，此图用八个示意。</desc><rect width="1000" height="760" rx="14" fill="#faf8f2"/><g font-family="Microsoft YaHei,sans-serif" fill="#24363d"><text x="35" y="43" font-size="26" font-weight="bold">同样是 0–60 m，深度区间怎样切？</text><text x="35" y="75" font-size="17" fill="#626e72">为看清边界，示意使用 8 个分箱；论文实际使用 80 个前景分箱。</text><path d="M100.0 110V618" stroke="#d6dad7" stroke-dasharray="4 5"/><text x="100.0" y="646" text-anchor="middle" font-size="17">0</text><path d="M240.0 110V618" stroke="#d6dad7" stroke-dasharray="4 5"/><text x="240.0" y="646" text-anchor="middle" font-size="17">10</text><path d="M380.0 110V618" stroke="#d6dad7" stroke-dasharray="4 5"/><text x="380.0" y="646" text-anchor="middle" font-size="17">20</text><path d="M520.0 110V618" stroke="#d6dad7" stroke-dasharray="4 5"/><text x="520.0" y="646" text-anchor="middle" font-size="17">30</text><path d="M660.0 110V618" stroke="#d6dad7" stroke-dasharray="4 5"/><text x="660.0" y="646" text-anchor="middle" font-size="17">40</text><path d="M800.0 110V618" stroke="#d6dad7" stroke-dasharray="4 5"/><text x="800.0" y="646" text-anchor="middle" font-size="17">50</text><path d="M940.0 110V618" stroke="#d6dad7" stroke-dasharray="4 5"/><text x="940.0" y="646" text-anchor="middle" font-size="17">60</text><text x="35" y="135" font-size="24" font-weight="bold" fill="#5496b4">UD</text><text x="145" y="135" font-size="18">每段一样宽</text><rect x="100.000" y="155" width="105.000" height="57" fill="#5496b4" fill-opacity="0.3" stroke="#faf8f2" stroke-width="1"/><rect x="205.000" y="155" width="105.000" height="57" fill="#5496b4" fill-opacity="0.65" stroke="#faf8f2" stroke-width="1"/><rect x="310.000" y="155" width="105.000" height="57" fill="#5496b4" fill-opacity="0.3" stroke="#faf8f2" stroke-width="1"/><rect x="415.000" y="155" width="105.000" height="57" fill="#5496b4" fill-opacity="0.65" stroke="#faf8f2" stroke-width="1"/><rect x="520.000" y="155" width="105.000" height="57" fill="#5496b4" fill-opacity="0.3" stroke="#faf8f2" stroke-width="1"/><rect x="625.000" y="155" width="105.000" height="57" fill="#5496b4" fill-opacity="0.65" stroke="#faf8f2" stroke-width="1"/><rect x="730.000" y="155" width="105.000" height="57" fill="#5496b4" fill-opacity="0.3" stroke="#faf8f2" stroke-width="1"/><rect x="835.000" y="155" width="105.000" height="57" fill="#5496b4" fill-opacity="0.65" stroke="#faf8f2" stroke-width="1"/><path d="M100.000 155v64" stroke="#5496b4" stroke-width="1.4"/><path d="M205.000 155v64" stroke="#5496b4" stroke-width="1.4"/><path d="M310.000 155v64" stroke="#5496b4" stroke-width="1.4"/><path d="M415.000 155v64" stroke="#5496b4" stroke-width="1.4"/><path d="M520.000 155v64" stroke="#5496b4" stroke-width="1.4"/><path d="M625.000 155v64" stroke="#5496b4" stroke-width="1.4"/><path d="M730.000 155v64" stroke="#5496b4" stroke-width="1.4"/><path d="M835.000 155v64" stroke="#5496b4" stroke-width="1.4"/><path d="M940.000 155v64" stroke="#5496b4" stroke-width="1.4"/><text x="100" y="251" font-size="16">区间宽度（m）：7.50 / 7.50 / 7.50 / 7.50 / 7.50 / 7.50 / 7.50 / 7.50</text><text x="35" y="310" font-size="24" font-weight="bold" fill="#40998c">LID</text><text x="145" y="310" font-size="18">每段比前一段多宽 1.67 m</text><rect x="100.000" y="330" width="23.333" height="57" fill="#40998c" fill-opacity="0.3" stroke="#faf8f2" stroke-width="1"/><rect x="123.333" y="330" width="46.667" height="57" fill="#40998c" fill-opacity="0.65" stroke="#faf8f2" stroke-width="1"/><rect x="170.000" y="330" width="70.000" height="57" fill="#40998c" fill-opacity="0.3" stroke="#faf8f2" stroke-width="1"/><rect x="240.000" y="330" width="93.333" height="57" fill="#40998c" fill-opacity="0.65" stroke="#faf8f2" stroke-width="1"/><rect x="333.333" y="330" width="116.667" height="57" fill="#40998c" fill-opacity="0.3" stroke="#faf8f2" stroke-width="1"/><rect x="450.000" y="330" width="140.000" height="57" fill="#40998c" fill-opacity="0.65" stroke="#faf8f2" stroke-width="1"/><rect x="590.000" y="330" width="163.333" height="57" fill="#40998c" fill-opacity="0.3" stroke="#faf8f2" stroke-width="1"/><rect x="753.333" y="330" width="186.667" height="57" fill="#40998c" fill-opacity="0.65" stroke="#faf8f2" stroke-width="1"/><path d="M100.000 330v64" stroke="#40998c" stroke-width="1.4"/><path d="M123.333 330v64" stroke="#40998c" stroke-width="1.4"/><path d="M170.000 330v64" stroke="#40998c" stroke-width="1.4"/><path d="M240.000 330v64" stroke="#40998c" stroke-width="1.4"/><path d="M333.333 330v64" stroke="#40998c" stroke-width="1.4"/><path d="M450.000 330v64" stroke="#40998c" stroke-width="1.4"/><path d="M590.000 330v64" stroke="#40998c" stroke-width="1.4"/><path d="M753.333 330v64" stroke="#40998c" stroke-width="1.4"/><path d="M940.000 330v64" stroke="#40998c" stroke-width="1.4"/><text x="100" y="426" font-size="16">区间宽度（m）：1.67 / 3.33 / 5.00 / 6.67 / 8.33 / 10.00 / 11.67 / 13.33</text><text x="35" y="485" font-size="24" font-weight="bold" fill="#bc8051">SID</text><text x="145" y="485" font-size="18">log(1 + d) 等分；越远增宽越快</text><rect x="100.000" y="505" width="9.404" height="57" fill="#bc8051" fill-opacity="0.3" stroke="#faf8f2" stroke-width="1"/><rect x="109.404" y="505" width="15.721" height="57" fill="#bc8051" fill-opacity="0.65" stroke="#faf8f2" stroke-width="1"/><rect x="125.126" y="505" width="26.282" height="57" fill="#bc8051" fill-opacity="0.3" stroke="#faf8f2" stroke-width="1"/><rect x="151.407" y="505" width="43.936" height="57" fill="#bc8051" fill-opacity="0.65" stroke="#faf8f2" stroke-width="1"/><rect x="195.343" y="505" width="73.449" height="57" fill="#bc8051" fill-opacity="0.3" stroke="#faf8f2" stroke-width="1"/><rect x="268.793" y="505" width="122.788" height="57" fill="#bc8051" fill-opacity="0.65" stroke="#faf8f2" stroke-width="1"/><rect x="391.580" y="505" width="205.268" height="57" fill="#bc8051" fill-opacity="0.3" stroke="#faf8f2" stroke-width="1"/><rect x="596.848" y="505" width="343.152" height="57" fill="#bc8051" fill-opacity="0.65" stroke="#faf8f2" stroke-width="1"/><path d="M100.000 505v64" stroke="#bc8051" stroke-width="1.4"/><path d="M109.404 505v64" stroke="#bc8051" stroke-width="1.4"/><path d="M125.126 505v64" stroke="#bc8051" stroke-width="1.4"/><path d="M151.407 505v64" stroke="#bc8051" stroke-width="1.4"/><path d="M195.343 505v64" stroke="#bc8051" stroke-width="1.4"/><path d="M268.793 505v64" stroke="#bc8051" stroke-width="1.4"/><path d="M391.580 505v64" stroke="#bc8051" stroke-width="1.4"/><path d="M596.848 505v64" stroke="#bc8051" stroke-width="1.4"/><path d="M940.000 505v64" stroke="#bc8051" stroke-width="1.4"/><text x="100" y="601" font-size="16">区间宽度（m）：0.67 / 1.12 / 1.88 / 3.14 / 5.25 / 8.77 / 14.66 / 24.51</text><text x="940" y="675" font-size="17" text-anchor="end">距离 d（m）→</text><text x="35" y="711" font-size="18">每个色块就是一个深度类别；边界越密，同样 1 m 的变化越容易跨过类别。</text><text x="35" y="740" font-size="14" fill="#687477">补充示意，非实验结果。SID 使用官方 bin_depths 中的 log(1 + d) 规则。</text></g></svg>