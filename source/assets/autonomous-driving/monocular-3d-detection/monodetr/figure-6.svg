<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">图 6 · 如何阅读原文的注意力热图？</title><desc id="desc">阅读示意：这里没有模型产生的热图或注意力数值</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#536b77"/></marker></defs><rect width="1000" height="430" rx="16" fill="#f5f3ed"/><g font-family="Microsoft YaHei, sans-serif" fill="#173742"><text x="36" y="44" font-size="25" font-weight="bold">图 6 · 如何阅读原文的注意力热图？</text><text x="36" y="74" font-size="16" fill="#607078">阅读示意：这里没有模型产生的热图或注意力数值</text><rect x="36" y="116" width="270" height="180" rx="10" fill="#f0dfbd" stroke="#bccbd0"/><text x="171.0" y="200.5" text-anchor="middle" font-size="19">① 看顶部 RGB 图像</text><text x="171.0" y="225.5" text-anchor="middle" font-size="19">确认场景和物体位置</text><path d="M306 206 L350 206" stroke="#536b77" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="365" y="116" width="270" height="180" rx="10" fill="#d9eaf0" stroke="#bccbd0"/><text x="500.0" y="200.5" text-anchor="middle" font-size="19">② 找下方白色标记</text><text x="500.0" y="225.5" text-anchor="middle" font-size="19">每行对应一个 Query</text><path d="M635 206 L679 206" stroke="#536b77" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="694" y="116" width="270" height="180" rx="10" fill="#efd9d2" stroke="#bccbd0"/><text x="829.0" y="200.5" text-anchor="middle" font-size="19">③ 看暖色响应分布</text><text x="829.0" y="225.5" text-anchor="middle" font-size="19">是否超出局部中心区域</text><text x="36" y="345" font-size="17">原图：上方为场景，下方三行为注意力示例。暖色表示更高注意力。</text><text x="36" y="372" font-size="17">请点击下方原图链接查看真实响应；示意不能替代实验可视化。</text><text x="36" y="410" font-size="13" fill="#607078">中文自绘 · 概念示意，非原论文图像</text></g></svg>