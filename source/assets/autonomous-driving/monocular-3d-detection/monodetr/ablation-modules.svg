<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="t d"><title id="t">表 5 · 每个变体具体留下哪些模块？</title><desc id="d">相同列对应相同模块；灰色划线表示该变体移除的部分。</desc><rect x="0" y="0" width="1000" height="720" rx="14" fill="#faf8f2" stroke="none"/><g font-family="Microsoft YaHei,sans-serif"><text x="30" y="43" font-size="25" fill="#203842" font-weight="bold">表 5 · 每个变体具体留下哪些模块？</text><text x="30" y="75" font-size="16" fill="#63777e">相同列对应相同模块；灰色划线表示该变体移除的部分。</text><text x="290" y="125" font-size="17" fill="#203842" font-weight="bold">深度预测器</text><text x="440" y="125" font-size="17" fill="#203842" font-weight="bold">深度编码器</text><text x="590" y="125" font-size="17" fill="#203842" font-weight="bold">视觉编码器</text><text x="740" y="125" font-size="17" fill="#203842" font-weight="bold">查询式解码器</text><text x="30" y="174" font-size="19" fill="#203842" font-weight="bold">完整模型</text><text x="30" y="200" font-size="13" fill="#68787f">MonoDETR</text><rect x="290" y="150" width="125" height="55" rx="6" fill="#dcebee" stroke="none"/><text x="327" y="184" font-size="17" fill="#256d7a">保留</text><rect x="440" y="150" width="125" height="55" rx="6" fill="#dcebee" stroke="none"/><text x="477" y="184" font-size="17" fill="#256d7a">保留</text><rect x="590" y="150" width="125" height="55" rx="6" fill="#dcebee" stroke="none"/><text x="627" y="184" font-size="17" fill="#256d7a">保留</text><rect x="740" y="150" width="125" height="55" rx="6" fill="#dcebee" stroke="none"/><text x="777" y="184" font-size="17" fill="#256d7a">保留</text><text x="740" y="229" font-size="14" fill="#203842">D → I → V</text><text x="900" y="184" font-size="22" fill="#256d7a" font-weight="bold">20.61</text><text x="30" y="284" font-size="19" fill="#203842" font-weight="bold">中心检测基线</text><text x="30" y="310" font-size="13" fill="#68787f">w/o Depth-guided Trans.</text><rect x="290" y="260" width="125" height="55" rx="6" fill="#ecebea" stroke="none"/><text x="327" y="294" font-size="17" fill="#9a9a96">移除</text><path d="M300 303L405 272" fill="none" stroke="#b5b6b2" stroke-width="1"/><rect x="440" y="260" width="125" height="55" rx="6" fill="#ecebea" stroke="none"/><text x="477" y="294" font-size="17" fill="#9a9a96">移除</text><path d="M450 303L555 272" fill="none" stroke="#b5b6b2" stroke-width="1"/><rect x="590" y="260" width="125" height="55" rx="6" fill="#ecebea" stroke="none"/><text x="627" y="294" font-size="17" fill="#9a9a96">移除</text><path d="M600 303L705 272" fill="none" stroke="#b5b6b2" stroke-width="1"/><rect x="740" y="260" width="125" height="55" rx="6" fill="#ecebea" stroke="none"/><text x="777" y="294" font-size="17" fill="#9a9a96">移除</text><path d="M750 303L855 272" fill="none" stroke="#b5b6b2" stroke-width="1"/><text x="740" y="339" font-size="14" fill="#203842">中心特征 → 属性头</text><text x="900" y="294" font-size="22" fill="#256d7a" font-weight="bold">15.15</text><text x="30" y="394" font-size="19" fill="#203842" font-weight="bold">中心基线 + 深度预测</text><text x="30" y="420" font-size="13" fill="#68787f">w/o Transformer</text><rect x="290" y="370" width="125" height="55" rx="6" fill="#dcebee" stroke="none"/><text x="327" y="404" font-size="17" fill="#256d7a">保留</text><rect x="440" y="370" width="125" height="55" rx="6" fill="#ecebea" stroke="none"/><text x="477" y="404" font-size="17" fill="#9a9a96">移除</text><path d="M450 413L555 382" fill="none" stroke="#b5b6b2" stroke-width="1"/><rect x="590" y="370" width="125" height="55" rx="6" fill="#ecebea" stroke="none"/><text x="627" y="404" font-size="17" fill="#9a9a96">移除</text><path d="M600 413L705 382" fill="none" stroke="#b5b6b2" stroke-width="1"/><rect x="740" y="370" width="125" height="55" rx="6" fill="#ecebea" stroke="none"/><text x="777" y="404" font-size="17" fill="#9a9a96">移除</text><path d="M750 413L855 382" fill="none" stroke="#b5b6b2" stroke-width="1"/><text x="740" y="449" font-size="14" fill="#203842">中心特征 → 属性头</text><text x="900" y="404" font-size="22" fill="#256d7a" font-weight="bold">16.05</text><text x="30" y="504" font-size="19" fill="#203842" font-weight="bold">纯视觉 Transformer</text><text x="30" y="530" font-size="13" fill="#68787f">w/o Depth Guidance</text><rect x="290" y="480" width="125" height="55" rx="6" fill="#ecebea" stroke="none"/><text x="327" y="514" font-size="17" fill="#9a9a96">移除</text><path d="M300 523L405 492" fill="none" stroke="#b5b6b2" stroke-width="1"/><rect x="440" y="480" width="125" height="55" rx="6" fill="#ecebea" stroke="none"/><text x="477" y="514" font-size="17" fill="#9a9a96">移除</text><path d="M450 523L555 492" fill="none" stroke="#b5b6b2" stroke-width="1"/><rect x="590" y="480" width="125" height="55" rx="6" fill="#dcebee" stroke="none"/><text x="627" y="514" font-size="17" fill="#256d7a">保留</text><rect x="740" y="480" width="125" height="55" rx="6" fill="#dcebee" stroke="none"/><text x="777" y="514" font-size="17" fill="#256d7a">保留</text><text x="740" y="559" font-size="14" fill="#203842">I → V；没有 D</text><text x="900" y="514" font-size="22" fill="#256d7a" font-weight="bold">17.81</text><text x="900" y="125" font-size="17" fill="#203842" font-weight="bold">AP</text><text x="30" y="618" font-size="17" fill="#203842">D：深度交叉注意力    I：查询间自注意力    V：视觉交叉注意力</text><text x="30" y="652" font-size="18" fill="#203842">深度引导被移除时，不只是少一层 D：深度预测器与深度编码器也一起移除。</text><text x="30" y="700" font-size="14" fill="#63777e">补充示意，非模型输出。AP 为原表 KITTI 验证集 Moderate AP₃D。</text></g></svg>