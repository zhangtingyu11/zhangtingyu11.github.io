<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="t d"><title id="t">三路距离估计的监督与推理</title><desc id="d">直接回归、几何计算和深度图采样的距离先等权平均。训练监督平均值，推理也用平均值。尺寸和深度图另有各自监督。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#607f87"/></marker></defs><rect width="960" height="470" rx="14" fill="#faf8f2"/><g font-family="Microsoft YaHei,sans-serif" fill="#203842"><text x="30" y="43" font-size="25" font-weight="bold">三路先取平均；训练和推理都使用这个深度</text><text x="30" y="74" font-size="16" fill="#63777e">依据官方实现绘制 · 实线表示前向计算，loss 的梯度沿计算路径回传</text><g fill="#dcebee"><rect x="35" y="110" width="235" height="58" rx="8"/><rect x="35" y="192" width="235" height="58" rx="8"/><rect x="35" y="274" width="235" height="58" rx="8"/><rect x="370" y="188" width="190" height="70" rx="8"/></g><g font-size="21"><text x="58" y="147">直接回归的距离</text><text x="58" y="229">由尺寸计算的距离</text><text x="58" y="311">深度图采样的距离</text><text x="397" y="219">三者等权平均</text><text x="405" y="245" font-size="16">最终物体深度</text></g><g fill="none" stroke="#607f87" stroke-width="2" marker-end="url(#a)"><path d="M270 139L315 139L360 217"/><path d="M270 221H360"/><path d="M270 303L315 303L360 231"/><path d="M560 218L602 218L640 160"/><path d="M560 231L602 231L640 288"/></g><rect x="651" y="120" width="274" height="87" rx="8" fill="#efe3cf"/><text x="671" y="150" font-size="21" font-weight="bold">训练</text><text x="671" y="181" font-size="18">与物体真值距离计算 loss</text><rect x="651" y="247" width="274" height="87" rx="8" fill="#dfe9d6"/><text x="671" y="277" font-size="21" font-weight="bold">推理</text><text x="671" y="308" font-size="18">结合中心投影恢复三维框</text><text x="35" y="385" font-size="18">另有监督：二维框与三维尺寸有检测损失；整张深度图有分类 focal loss。</text><text x="35" y="418" font-size="18" font-weight="bold">没有给三路距离各算一份独立的物体深度 loss，也不在推理时三选一。</text><text x="35" y="450" font-size="14" fill="#63777e">补充示意，非论文原图。平均结果使用带预测不确定性的深度损失。</text></g></svg>