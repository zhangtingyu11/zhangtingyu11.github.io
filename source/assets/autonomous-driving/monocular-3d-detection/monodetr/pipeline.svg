<text x="716" y="308">① 深度交叉注意力</text>
<rect x="578" y="345" width="276" height="50" rx="7" fill="#edf0ed"/>
<text x="716" y="378">② 查询间自注意力</text>
<rect x="578" y="414" width="276" height="50" rx="7" fill="#e2eaf2"/>
<text x="716" y="447">③ 视觉交叉注意力</text>
<text x="716" y="491" font-size="15" fill="#637783">随后经过前馈网络</text>
