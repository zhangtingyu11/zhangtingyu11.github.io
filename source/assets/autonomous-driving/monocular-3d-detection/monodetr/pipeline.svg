<rect x="948" y="322" width="198" height="104" rx="10"/>
</g>
<g stroke="#6c7e8c" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path d="M204 312H235V250H274"/><path d="M204 336H235V403H274"/>
<path d="M464 250H505V438H576"/><path d="M464 403H526V304H576"/>
<path d="M878 374H948"/><path d="M716 176V256"/>
<path d="M716 327V345"/><path d="M716 395V414"/>
</g>
<g text-anchor="middle" font-size="21">
<text x="129" y="318">单目图像</text><text x="129" y="346" font-size="16" fill="#637783">ResNet-50</text>
<text x="369" y="245">视觉编码器</text><text x="369" y="271" font-size="16" fill="#637783">外观与语义</text>
<text x="369" y="398">深度预测与编码</text><text x="369" y="424" font-size="16" fill="#637783">距离相关特征</text>
