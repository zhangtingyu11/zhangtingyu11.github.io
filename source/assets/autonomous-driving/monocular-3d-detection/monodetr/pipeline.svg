<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">MonoDETR：深度引导的单目三维目标检测</title>
<desc id="desc">自绘简化流程。图像经主干分成视觉和深度两路；物体查询先读深度、再做查询间交互、再读视觉，最后输出三维属性。深度图由物体级标签监督。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6c7e8c" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="630" fill="#f4f6f3"/>
