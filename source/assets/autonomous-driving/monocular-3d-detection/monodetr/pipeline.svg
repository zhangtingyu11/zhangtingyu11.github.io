<text x="54" y="124" font-size="44" font-weight="700">MonoDETR</text>
<text x="352" y="124" font-size="25">让深度信息参与物体查询的更新</text>
<g fill="white" stroke="#a5b4bd" stroke-width="1.6">
<rect x="54" y="284" width="150" height="80" rx="10"/>
