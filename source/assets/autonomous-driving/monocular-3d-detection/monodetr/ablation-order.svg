<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="960" viewBox="0 0 1000 960" role="img" aria-labelledby="t desc"><title id="t">表 7 · 换顺序，改变的是后一步收到的 query</title><desc id="desc">同一行从左向右处理；每一步都接收上一步已经更新的查询，不会重新从 q₀ 开始。</desc><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#718b94"/></marker></defs><rect x="0" y="0" width="1000" height="960" rx="8" fill="#faf8f2"/><g font-family="Microsoft YaHei,sans-serif"><text x="30" y="43" font-size="25" fill="#203842" font-weight="bold">表 7 · 换顺序，改变的是后一步收到的 query</text><text x="30" y="76" font-size="16" fill="#62757d">同一行从左向右处理；每一步都接收上一步已经更新的查询，不会重新从 q₀ 开始。</text><text x="30" y="118" font-size="23" fill="#203842" font-weight="bold">D → I → V</text><text x="825" y="118" font-size="21" fill="#28788a" font-weight="bold">AP 20.61</text><rect x="100" y="138" width="230" height="89" rx="8" fill="#d2e8eb"/><text x="115" y="165" font-size="18" fill="#203842" font-weight="bold">D</text><text x="115" y="191" font-size="17" fill="#203842">q₀ 读取深度</text><text x="115" y="215" font-size="17" fill="#203842">得到 q₁</text><rect x="385" y="138" width="230" height="89" rx="8" fill="#eee3d1"/><text x="400" y="165" font-size="18" fill="#203842" font-weight="bold">I</text><text x="400" y="191" font-size="17" fill="#203842">已读深度的 q₁</text><text x="400" y="215" font-size="17" fill="#203842">彼此交互 → q₂</text><path d="M330 184L377 184" fill="none" stroke="#718b94" stroke-width="2" marker-end="url(#arr)"/><rect x="670" y="138" width="230" height="89" rx="8" fill="#deead6"/><text x="685" y="165" font-size="18" fill="#203842" font-weight="bold">V</text><text x="685" y="191" font-size="17" fill="#203842">用 q₂ 读取视觉</text><text x="685" y="215" font-size="17" fill="#203842">得到 q₃</text><path d="M615 184L662 184" fill="none" stroke="#718b94" stroke-width="2" marker-end="url(#arr)"/><text x="40" y="260" font-size="17" fill="#203842">本轮深度能影响：当前层的候选交互 I，以及后续视觉读取 V。</text><text x="30" y="293" font-size="23" fill="#203842" font-weight="bold">I → D → V</text><text x="825" y="293" font-size="21" fill="#28788a" font-weight="bold">AP 19.28</text><rect x="100" y="313" width="230" height="89" rx="8" fill="#eee3d1"/><text x="115" y="340" font-size="18" fill="#203842" font-weight="bold">I</text><text x="115" y="366" font-size="17" fill="#203842">输入查询 q₀</text><text x="115" y="390" font-size="17" fill="#203842">先交互 → q₁</text><rect x="385" y="313" width="230" height="89" rx="8" fill="#d2e8eb"/><text x="400" y="340" font-size="18" fill="#203842" font-weight="bold">D</text><text x="400" y="366" font-size="17" fill="#203842">交互后的 q₁</text><text x="400" y="390" font-size="17" fill="#203842">读深度 → q₂</text><path d="M330 359L377 359" fill="none" stroke="#718b94" stroke-width="2" marker-end="url(#arr)"/><rect x="670" y="313" width="230" height="89" rx="8" fill="#deead6"/><text x="685" y="340" font-size="18" fill="#203842" font-weight="bold">V</text><text x="685" y="366" font-size="17" fill="#203842">已读深度的 q₂</text><text x="685" y="390" font-size="17" fill="#203842">读视觉 → q₃</text><path d="M615 359L662 359" fill="none" stroke="#718b94" stroke-width="2" marker-end="url(#arr)"/><text x="40" y="435" font-size="17" fill="#203842">本轮深度能影响 V；不能回头改变这一层已经完成的 I。</text><text x="30" y="468" font-size="23" fill="#203842" font-weight="bold">I → V → D</text><text x="825" y="468" font-size="21" fill="#28788a" font-weight="bold">AP 18.85</text><rect x="100" y="488" width="230" height="89" rx="8" fill="#eee3d1"/><text x="115" y="515" font-size="18" fill="#203842" font-weight="bold">I</text><text x="115" y="541" font-size="17" fill="#203842">输入查询 q₀</text><text x="115" y="565" font-size="17" fill="#203842">先交互 → q₁</text><rect x="385" y="488" width="230" height="89" rx="8" fill="#deead6"/><text x="400" y="515" font-size="18" fill="#203842" font-weight="bold">V</text><text x="400" y="541" font-size="17" fill="#203842">交互后的 q₁</text><text x="400" y="565" font-size="17" fill="#203842">读视觉 → q₂</text><path d="M330 534L377 534" fill="none" stroke="#718b94" stroke-width="2" marker-end="url(#arr)"/><rect x="670" y="488" width="230" height="89" rx="8" fill="#d2e8eb"/><text x="685" y="515" font-size="18" fill="#203842" font-weight="bold">D</text><text x="685" y="541" font-size="17" fill="#203842">视觉更新后的 q₂</text><text x="685" y="565" font-size="17" fill="#203842">读深度 → q₃</text><path d="M615 534L662 534" fill="none" stroke="#718b94" stroke-width="2" marker-end="url(#arr)"/><text x="40" y="610" font-size="17" fill="#203842">本轮深度在末尾进入查询，传给 FFN 和下一层；当前层 I、V 已结束。</text><text x="30" y="643" font-size="23" fill="#203842" font-weight="bold">I → (D + V)</text><text x="825" y="643" font-size="21" fill="#28788a" font-weight="bold">AP 18.41</text><rect x="100" y="663" width="230" height="89" rx="8" fill="#eee3d1"/><text x="115" y="690" font-size="18" fill="#203842" font-weight="bold">I</text><text x="115" y="716" font-size="17" fill="#203842">输入查询 q₀</text><text x="115" y="740" font-size="17" fill="#203842">先交互 → q₁</text><rect x="385" y="663" width="515" height="89" rx="8" fill="#dce7de"/><text x="400" y="690" font-size="18" fill="#203842" font-weight="bold">一次交叉注意力</text><text x="400" y="716" font-size="17" fill="#203842">深度与视觉先逐元素相加</text><text x="400" y="740" font-size="17" fill="#203842">q₁ 统一读取 → q₂</text><path d="M330 709L377 709" fill="none" stroke="#718b94" stroke-width="2" marker-end="url(#arr)"/><text x="40" y="785" font-size="17" fill="#203842">不产生“单独读完深度，再决定怎样读视觉”的中间查询状态。</text><text x="30" y="843" font-size="18" fill="#203842" font-weight="bold">每一行只展开一个解码层；输出经过共同的 FFN，再作为下一层输入。</text><text x="30" y="875" font-size="17" fill="#203842">q₀ 可能已经含有上一层的深度信息。“本轮深度”指这一层 D 新读取的信息。</text><text x="30" y="907" font-size="15" fill="#62757d">示意省略多头、残差、归一化；状态编号表示连续更新，不表示拼接独立信息块。</text><text x="30" y="934" font-size="15" fill="#62757d">AP 来自原表 7（KITTI 验证集 Moderate）；箭头说明依赖关系，不证明具体增益原因。</text></g></svg>