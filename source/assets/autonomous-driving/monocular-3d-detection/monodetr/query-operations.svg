old">I · 候选之间交换信息</text><rect x="355" y="137" width="305" height="192" rx="8" fill="#eee3d1"/><path d="M421 186L588 187" fill="none" stroke="#b8a17d" stroke-width="2"/><path d="M421 186L427 277" fill="none" stroke="#b8a17d" stroke-width="2"/><path d="M421 186L585 276" fill="none" stroke="#b8a17d" stroke-width="2"/><path d="M588 187L427 277" fill="none" stroke="#b8a17d" stroke-width="2"/><path d="M588 187L585 276" fill="none" stroke="#b8a17d" stroke-width="2"/><path d="M427 277L585 276" fill="none" stroke="#b8a17d" stroke-width="2"/><circle cx="421" cy="186" r="8" fill="#286f80"/><text x="410" y="169" font-size="16" fill="#203842">q1</text><circle cx="588" cy="187" r="8" fill="#286f80"/><text x="577" y="170" font-size="16" fill="#203842">q2</text><circle cx="427" cy="277" r="8" fill="#286f80"/><text x="416" y="260" font-size="16" fill="#203842">q3</text><circle cx="585" cy="276" r="8" fill="#286f80"/><text x="574" y="259" font-size="16" fill="#203842">q4</text><text x="444" y="231" font-size="15" fill="#203842">整组候选 queries</text><text x="365" y="359" font-size="18" fill="#203842">所有查询共同更新</text><text x="685" y="119" font-size="20" fill="#203842" font-weight="bold">V · 查询读取视觉图</text><rect x="685" y="137" width="305" height="192" rx="8" fill="#deead6"/><rect x="813" y="162" width="23" height="23" rx="8" fill="#fcfbf6"/><rect x="840" y="162" width="23" height="23" rx="8" fill="#fcfbf6"/><rect x="867" y="162" width="23" height="23" rx="8" fill="#fcfbf6"/><rect x="894" y="162" width="23" height="23" rx="8" fill="#fcfbf6"/><rect x="921" y="162" width="23" height="23" rx="8" fill="#fcfbf6"/><rect x="813" y="189" width="23" height="23" rx="8" fill="#fcfbf6"/><rect x="840" y="189" width="23" height="23" rx="8" fill="#fcfbf6"/><rect x="867" y="189" width="23" height="23" rx="8" fill="#fcfbf6"/><rect x="894" y="189" width="23" height="23" rx="8" fill="#fcfbf6"/><rect x="921" y="189" width="23" height="23" rx="8" fill="#fcfbf6"/><rect x="813" y="216" width="23" height="23" rx="8" fill="#fcfbf6"/><rect x="840" y="216" width="23" height="23" rx="8" fill="#fcfbf6"/><rect x="867" y="216" width="23" height="23" rx="8" fill="#fcfbf6"/><rect x="894" y="216" width="23" height="23" rx="8" fill="#fcfbf6"/><rect x="921" y="216" width="23" height="23" rx="8" fill="#fcfbf6"/><rect x="813" y="243" width="23" height="23" rx="8" fill="#fcfbf6"/><rect x="840" y="243" width="23" height="23" rx="8" fill="#fcfbf6"/><rect x="867" y="243" width="23" height="23" rx="8" fill="#fcfbf6"/><rect x="894" y="243" width="23" height="23" rx="8" fill="#fcfbf6"/><rect x="921" y="243" width="23" height="23" rx="8" fill="#fcfbf6"/><circle cx="722" cy="224" r="8" fill="#286f80"/><text x="700" y="260" font-size="15" fill="#203842">query</text><path d="M733 224L824 200" fill="none" stroke="#73986c" stroke-width="2"/><path d="M733 224L905 173" fill="none" stroke="#73986c" stroke-width="2"/><path d="M733 224L878 245" fill="none" stroke="#73986c" stroke-width="2"/><text x="799" y="302" font-size="16" fill="#203842">视觉嵌入 F_V</text><text x="695" y="359" font-size="18" fill="#203842">补充当前候选的视觉特征</text><text x="30" y="399" font-size="17" fill="#203842">D / V 读取特征图来更新 query，不在这一步改写特征图；I 读取的是其他 queries。</text><text x="30" y="432" font-size="15" fill="#62757d">结构示意，非实际注意力权重。V 用少量采样点示意可变形注意力。</text></g></svg>